services:
  postgres:
    image: postgres:16
    container_name: ai_workflow_postgres
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: ai_workflows
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d ai_workflows"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
